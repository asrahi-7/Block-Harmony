<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Block Harmony</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg1:#f3f5ff; --bg2:#dfe6ff; --text:#1a2050; --muted:#5d668f;
  --panel:rgba(255,255,255,.66); --panel-border:rgba(40,50,120,.14);
  --cell:#dde3fa; --cell-border:rgba(40,50,120,.10);
  --accent:#5865f2; --accent2:#e64fb4; --good:#12a36b; --warn:#e07a12; --danger:#e5484d;
  --modal:#ffffff; --shadow:0 12px 32px rgba(40,50,120,.18);
  --orb1:#8f9cff; --orb2:#ff9de0; --orb3:#7fe6ff;
  --board:max(250px,min(calc(100vw - 24px),440px,calc(100vh - 372px)));
  --tc:clamp(11px,calc(var(--board) / 22),20px);
}
@supports (height:100dvh) {
  :root { --board:max(250px,min(calc(100vw - 24px),440px,calc(100dvh - 372px))); }
}

/* Dark Mode logic controlled by data attribute */
:root[data-theme="dark"] {
  --bg1:#0a0e1f; --bg2:#141a3a; --text:#edf1ff; --muted:#93a0cc;
  --panel:rgba(255,255,255,.06); --panel-border:rgba(255,255,255,.11);
  --cell:#0e1330; --cell-border:rgba(255,255,255,.055);
  --accent:#7c8bff; --accent2:#ff5fcf; --good:#3ddc97; --warn:#ffb020; --danger:#ff5d66;
  --modal:#161d42; --shadow:0 14px 40px rgba(0,0,0,.5);
  --orb1:#4b5cff; --orb2:#ff3fb4; --orb3:#19c6ff;
}

:root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html { height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body {
  height:100%; overflow-x:hidden; overflow-y:auto;
  background-color:var(--bg1);
  background-image:linear-gradient(165deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  color:var(--text);
  font-family:'Fredoka',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button { font-family:inherit; }

/* ---------- ambient background ---------- */
.bg { position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.orb { position:absolute; border-radius:50%; filter:blur(70px); opacity:.42; animation:drift 22s ease-in-out infinite alternate; }
.o1 { width:340px; height:340px; background:var(--orb1); top:-90px; left:-90px; }
.o2 { width:300px; height:300px; background:var(--orb2); bottom:-80px; right:-70px; animation-duration:28s; }
.o3 { width:240px; height:240px; background:var(--orb3); top:45%; left:55%; animation-duration:32s; opacity:.28; }
@keyframes drift { to { transform:translate(60px,40px) scale(1.15); } }
#fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40; }

/* ---------- layout ---------- */
.app { position:relative; z-index:1; min-height:100%; display:flex; flex-direction:column; align-items:center; gap:8px; padding:10px 12px 16px; }
.top { display:flex; align-items:center; justify-content:space-between; width:var(--board); }
.top > div { text-align:center; }
.top-actions { display:flex; gap:8px; }
h1 { font-size:22px; font-weight:700; letter-spacing:-.3px; line-height:1.1; }
.mode { font-size:12px; color:var(--muted); font-weight:500; }
.icon-btn { width:40px; height:40px; border-radius:13px; border:1px solid var(--panel-border); background:var(--panel); color:var(--text); font-size:18px; cursor:pointer; backdrop-filter:blur(8px); transition:transform .12s; }
.icon-btn:active { transform:scale(.92); }
.icon-btn:focus-visible, .pw:focus-visible, .btn:focus-visible, .lv:focus-visible, .slot:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

.hud { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:var(--board); }
.hud-box { background:var(--panel); border:1px solid var(--panel-border); border-radius:14px; padding:5px 8px 6px; text-align:center; backdrop-filter:blur(8px); }
.hud-label { font-size:12px; color:var(--muted); font-weight:500; }
.hud-val { font-size:22px; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; }
.hud-val.low { color:var(--danger); }
.pulse { animation:sPulse .35s ease; }
@keyframes sPulse { 50% { transform:scale(1.25); color:var(--good); } }

.goal { width:var(--board); display:none; }
.goal.on { display:block; }
.goal-top { display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:3px; }
.goal-top span:last-child { color:var(--muted); font-variant-numeric:tabular-nums; }
.goal-track { height:10px; border-radius:99px; background:var(--panel); border:1px solid var(--panel-border); overflow:hidden; }
.goal-fill { height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .55s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 12px var(--accent2); }

#combo { height:24px; display:flex; align-items:center; justify-content:center; gap:10px; font-weight:700; color:var(--warn); opacity:0; transform:translateY(4px); transition:opacity .25s, transform .25s; }
#combo.on { opacity:1; transform:none; }
.pips { display:flex; gap:4px; }
.pip { width:18px; height:6px; border-radius:99px; background:var(--panel-border); transition:background .2s, box-shadow .2s; }
.pip.on { background:var(--warn); box-shadow:0 0 8px var(--warn); }

.wrap { position:relative; }
.wrap.shake { animation:shake .38s; }
@keyframes shake {
  0%,100% { transform:translate(0); }
  20% { transform:translate(calc(var(--sh) * -1),calc(var(--sh) * .5)); }
  40% { transform:translate(var(--sh),calc(var(--sh) * -.5)); }
  60% { transform:translate(calc(var(--sh) * -.6),0); }
  80% { transform:translate(calc(var(--sh) * .4),calc(var(--sh) * .3)); }
}
#board {
  display:grid; grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(10,1fr); gap:3px; padding:6px;
  width:var(--board); height:var(--board); border-radius:18px;
  background:var(--panel); border:1px solid var(--panel-border); box-shadow:var(--shadow);
  touch-action:none; user-select:none; -webkit-user-select:none; backdrop-filter:blur(8px);
  transition:box-shadow .3s;
}
.app.fever #board { animation:fever 1s ease-in-out infinite alternate; }
@keyframes fever { from { box-shadow:0 0 0 1px var(--accent2),0 0 18px color-mix(in srgb,var(--accent2) 45%,transparent); } to { box-shadow:0 0 0 2px var(--warn),0 0 40px color-mix(in srgb,var(--warn) 55%,transparent); } }
.app.targeting #board { cursor:crosshair; box-shadow:0 0 0 2px var(--danger),0 0 26px color-mix(in srgb,var(--danger) 50%,transparent); }

/* ---------- cells & pieces ---------- */
.cell { position:relative; border-radius:24%; background:var(--cell); box-shadow:inset 0 0 0 1px var(--cell-border); }
.cell.f, .pc {
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 68%,#fff) 0%,var(--c) 48%,color-mix(in srgb,var(--c) 76%,#000) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.42),inset 0 -3px 0 rgba(0,0,0,.22),0 2px 7px color-mix(in srgb,var(--c) 42%,transparent);
}
.cell.st {
  background:linear-gradient(115deg,transparent 45%,rgba(0,0,0,.28) 46%,rgba(0,0,0,.28) 50%,transparent 51%),linear-gradient(150deg,#98a1b8,#5b6379);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.28),inset 0 -3px 0 rgba(0,0,0,.32);
}
.pc, .pe { width:var(--s); height:var(--s); }
.pc { position:relative; border-radius:24%; }
.gem::after {
  content:''; position:absolute; inset:24%; clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%);
  background:linear-gradient(135deg,#fff,#a8ecff 55%,#38bdf8); filter:drop-shadow(0 0 3px #a8ecff); animation:gemShine 2.2s ease-in-out infinite;
}
@keyframes gemShine { 50% { transform:scale(1.14) rotate(6deg); filter:drop-shadow(0 0 7px #fff); } }

.cell.land { animation:land .28s ease-out; }
@keyframes land { 0% { transform:scale(1.22); } 55% { transform:scale(.9); } 100% { transform:scale(1); } }
.cell.clearing { animation:clearPop .42s cubic-bezier(.3,.7,.4,1) var(--d,0ms) forwards; z-index:2; }
@keyframes clearPop {
  0% { transform:scale(1); filter:brightness(1); }
  30% { transform:scale(1.2); filter:brightness(2.4) saturate(1.4); }
  100% { transform:scale(0) rotate(40deg); opacity:0; }
}
.cell.ghost { background:color-mix(in srgb,var(--gc) 55%,transparent); box-shadow:inset 0 0 0 2px var(--gc),0 0 12px color-mix(in srgb,var(--gc) 55%,transparent); }
.cell.will-clear { animation:wc .45s ease-in-out infinite alternate; }
@keyframes wc { from { filter:brightness(1); } to { filter:brightness(1.7) saturate(1.4); box-shadow:0 0 0 2px #fff,0 0 16px var(--gc); } }
.cell.blast { box-shadow:inset 0 0 0 2px var(--danger),0 0 14px var(--danger); filter:brightness(1.25); }

/* Keyboard Cursor */
.cell.kb-cursor::after {
  content:''; position:absolute; inset:-4px; border:3px solid var(--accent); border-radius:30%; z-index:10; box-shadow: 0 0 12px var(--accent);
}

/* ---------- banner + floating text ---------- */
#banner { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; text-align:center; z-index:5; }
#banner .pop { display:block; font-weight:700; font-size:clamp(32px,10vw,54px); letter-spacing:-.5px; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.25),0 0 26px var(--accent2); opacity:0; animation:bannerPop 1.1s cubic-bezier(.2,1.3,.3,1) forwards; }
#banner small { display:block; font-size:.42em; color:#ffd166; margin-top:-2px; }
@keyframes bannerPop { 0% { opacity:0; transform:scale(.4) rotate(-6deg); } 22% { opacity:1; transform:scale(1.12) rotate(2deg); } 40% { transform:scale(1); } 80% { opacity:1; } 100% { opacity:0; transform:scale(1.08) translateY(-16px); } }
.float { position:fixed; z-index:60; pointer-events:none; font-weight:700; font-size:22px; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.45); animation:floatUp 1s ease-out forwards; }
.float.big { font-size:32px; color:#ffe27a; }
@keyframes floatUp { 0% { opacity:0; transform:translate(-50%,-30%) scale(.6); } 15% { opacity:1; transform:translate(-50%,-50%) scale(1.15); } 100% { opacity:0; transform:translate(-50%,-190%) scale(1); } }

/* ---------- tray ---------- */
#tray { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:var(--board); }
.slot { height:calc(var(--board) * .3); min-height:84px; display:grid; place-items:center; background:var(--panel); border:1px solid var(--panel-border); border-radius:18px; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; transition:transform .15s,opacity .2s; animation:slotIn .4s cubic-bezier(.2,1.2,.3,1) backwards; animation-delay:calc(var(--i) * 70ms); backdrop-filter:blur(8px); }
.slot:hover { transform:translateY(-2px); }
.slot:active { cursor:grabbing; }
.slot:focus-visible { transform:translateY(-4px); }
.slot.used { opacity:.22; pointer-events:none; }
.slot.lifting .pg { opacity:.2; }
.slot.wobble { animation:wobble .32s; }
.pg { display:grid; gap:3px; --s:var(--tc); pointer-events:none; transition:opacity .15s; }
@keyframes slotIn { from { opacity:0; transform:translateY(24px) scale(.85); } }
@keyframes wobble { 25% { transform:translateX(-6px); } 50% { transform:translateX(6px); } 75% { transform:translateX(-3px); } }

#ghost { position:fixed; left:0; top:0; z-index:50; pointer-events:none; display:none; will-change:transform; }
.gg { display:grid; filter:drop-shadow(0 12px 14px rgba(0,0,0,.35)); animation:pick .16s ease-out; }
@keyframes pick { from { transform:scale(.6); } }

/* ---------- power-ups ---------- */
.powers { display:flex; gap:10px; width:var(--board); }
.pw { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px 6px; border-radius:14px; border:1px solid var(--panel-border); background:var(--panel); color:var(--text); font-weight:600; font-size:14px; cursor:pointer; backdrop-filter:blur(8px); transition:transform .12s,opacity .2s,background .2s; }
.pw:active { transform:scale(.95); }
.pw[disabled] { opacity:.35; cursor:not-allowed; }
.pw.armed { background:var(--danger); color:#fff; box-shadow:0 0 18px var(--danger); }
.pw .n { min-width:20px; height:20px; padding:0 5px; border-radius:99px; background:var(--accent); color:#fff; font-size:12px; display:grid; place-items:center; }
.pw.gain { animation:gain .6s; }
@keyframes gain { 30% { transform:scale(1.18) rotate(-3deg); box-shadow:0 0 22px var(--warn); } }

/* ---------- modal ---------- */
#overlay { position:fixed; inset:0; z-index:100; display:none; place-items:center; padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)); background:color-mix(in srgb,var(--bg1) 62%,transparent); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
#overlay.on { display:grid; }
.modal { width:min(360px,100%); max-height:100%; overflow:auto; background:var(--modal); border:1px solid var(--panel-border); border-radius:26px; padding:24px 20px; box-shadow:var(--shadow); text-align:center; animation:modalIn .32s cubic-bezier(.2,1.2,.3,1); }
@keyframes modalIn { from { opacity:0; transform:translateY(20px) scale(.92); } }
.modal h2 { font-size:26px; font-weight:700; letter-spacing:-.3px; margin-bottom:4px; }
.modal h3 { font-size:19px; font-weight:600; margin-bottom:4px; }
.sub { color:var(--muted); font-size:14px; line-height:1.5; margin-bottom:16px; }
.stack { display:grid; gap:10px; }
.btn { display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 18px; border-radius:16px; border:1px solid var(--panel-border); background:var(--panel); color:var(--text); font-size:16px; font-weight:600; cursor:pointer; transition:transform .12s; }
.btn:active { transform:scale(.97); }
.btn.primary { border:none; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 40%,transparent); }
.pill { font-size:12px; font-weight:600; padding:2px 9px; border-radius:99px; background:var(--panel-border); }
.logo { display:grid; grid-template-columns:repeat(2,26px); gap:4px; justify-content:center; margin:0 auto 12px; --s:26px; transform:rotate(-8deg); }
.logo .pc:nth-child(2) { transform:translateY(-6px); }
.logo .pc:nth-child(3) { transform:translateY(6px); }
.pals { display:flex; justify-content:center; gap:8px; margin-top:16px; }
.pal { display:grid; grid-template-columns:repeat(4,1fr); gap:2px; width:64px; padding:5px; border-radius:12px; border:2px solid transparent; background:var(--panel-border); cursor:pointer; }
.pal.on { border-color:var(--accent); }
.pal i { height:9px; border-radius:3px; }
.lvls { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; max-height:50vh; overflow:auto; padding:4px; margin-bottom:14px; }
.lv { aspect-ratio:1; border-radius:14px; border:1px solid var(--panel-border); background:var(--panel); color:var(--text); font-size:18px; font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
.lv small { font-size:10px; color:#f4b400; letter-spacing:1px; height:11px; }
.lv.locked { opacity:.38; cursor:not-allowed; }
.lv.done { border-color:color-mix(in srgb,var(--good) 55%,transparent); }
.chip { display:inline-block; padding:3px 12px; border-radius:99px; background:var(--panel-border); font-size:13px; font-weight:600; margin-bottom:10px; }
.rules { text-align:left; display:grid; gap:8px; margin-bottom:16px; font-size:14px; }
.rules div { display:flex; gap:10px; align-items:baseline; padding:8px 10px; border-radius:12px; background:var(--panel); border:1px solid var(--panel-border); }
.stars { display:flex; justify-content:center; gap:8px; font-size:44px; margin:6px 0 10px; }
.star { color:var(--panel-border); }
.star.on { color:#ffc933; filter:drop-shadow(0 0 8px #ffc933); animation:starPop .55s cubic-bezier(.2,1.6,.3,1) backwards; animation-delay:calc(var(--i) * .25s + .2s); }
@keyframes starPop { from { transform:scale(0) rotate(-90deg); } }
.bigscore { font-size:44px; font-weight:700; line-height:1.1; }
.how { text-align:left; display:grid; gap:9px; font-size:14px; line-height:1.45; margin-bottom:16px; }
.how b { color:var(--accent); }

#toast { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); opacity:0; max-width:calc(100vw - 32px); text-align:center; background:var(--modal); border:1px solid var(--panel-border); padding:10px 16px; border-radius:99px; font-weight:600; font-size:14px; box-shadow:var(--shadow); z-index:120; pointer-events:none; transition:opacity .3s,transform .3s; }
#toast.on { opacity:1; transform:translate(-50%,0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<canvas id="fx" aria-hidden="true"></canvas>

<main class="app" id="app">
  <div class="top">
    <button class="icon-btn" id="btn-menu" aria-label="Menu">☰</button>
    <div><h1>Block Harmony</h1><div class="mode" id="mode"></div></div>
    <div class="top-actions">
        <button class="icon-btn" id="btn-theme" aria-label="Toggle theme">🌙</button>
        <button class="icon-btn" id="btn-sound" aria-label="Toggle sound">🔊</button>
    </div>
  </div>

  <div class="hud">
    <div class="hud-box"><div class="hud-label">Score</div><div class="hud-val" id="val1">0</div></div>
    <div class="hud-box"><div class="hud-label" id="lbl2">Best</div><div class="hud-val" id="val2">0</div></div>
    <div class="hud-box"><div class="hud-label" id="lbl3">Lines</div><div class="hud-val" id="val3">0</div></div>
  </div>

  <div class="goal" id="goal">
    <div class="goal-top"><span id="goal-name"></span><span id="goal-num"></span></div>
    <div class="goal-track"><div class="goal-fill" id="goal-fill"></div></div>
  </div>

  <div id="combo"><span id="combo-text">Combo ×1</span><span class="pips"><i class="pip"></i><i class="pip"></i><i class="pip"></i></span></div>

  <div class="wrap" id="wrap">
    <div id="board" role="grid" aria-label="Game board"></div>
    <div id="banner" aria-live="polite"></div>
  </div>

  <div id="tray"></div>

  <div class="powers">
    <button class="pw" id="pw-bomb" aria-label="Bomb power-up">💣 Bomb <span class="n" id="n-bomb">0</span></button>
    <button class="pw" id="pw-shuffle" aria-label="Shuffle power-up">🔀 Shuffle <span class="n" id="n-shuffle">0</span></button>
    <button class="pw" id="pw-undo" aria-label="Undo power-up">↩ Undo <span class="n" id="n-undo">0</span></button>
  </div>
</main>

<div id="ghost"></div>
<div id="overlay"><div class="modal" id="modal"></div></div>
<div id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* =========================================================
   Setup, storage, helpers
   ========================================================= */
const GS = 10;
const KEY = 'bh2_save';
let save = { best: 0, stars: {}, muted: false, pal: 0, theme: 'auto', ongoing: null };
try { const raw = localStorage.getItem(KEY); if (raw) save = Object.assign(save, JSON.parse(raw)); } catch (e) {}

function persist() {
  if (S && S.mode === 'endless' && !S.over && !S.busy) save.ongoing = JSON.stringify(S);
  else save.ongoing = null;
  try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} 
}

const $ = id => document.getElementById(id);
const rnd = n => Math.floor(Math.random() * n);
const REDUCE = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const boardEl = $('board'), trayEl = $('tray'), wrapEl = $('wrap'), appEl = $('app'), ghostEl = $('ghost');
const bannerEl = $('banner'), toastEl = $('toast'), overlay = $('overlay'), modal = $('modal'), comboEl = $('combo');
const scoreEl = $('val1');

const PALETTES = [
  { name: 'Candy', c: ['#ff5d8f', '#ff9f43', '#ffd23f', '#3ddc97', '#38b6ff', '#7c6cff', '#c86bff', '#ff6b6b'] },
  { name: 'Neon',  c: ['#00f5d4', '#00bbf9', '#9b5de5', '#f15bb5', '#fee440', '#ff6d00', '#80ed99', '#4d96ff'] },
  { name: 'Earth', c: ['#e76f51', '#f4a261', '#e9c46a', '#2a9d8f', '#4a8fe7', '#8d6bd1', '#c05299', '#6a994e'] },
];
const col = i => PALETTES[save.pal].c[i % 8];

const SHAPES = [

const fxc = $('fx'), g2 = fxc.getContext('2d');

function sizeFx() {
  const w = window.innerWidth, h = window.innerHeight;
  // Prevent wiping canvas if only height changed slightly (e.g. mobile URL bar hiding/showing)
  if (W > 0 && Math.abs(w - lastW) < 10 && Math.abs(h - lastH) < 120) {
      lastH = h;
      return;

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

}

/* =========================================================
   Game state
   ========================================================= */
let S = null;
const emptyGrid = () => Array.from({ length: GS }, () => Array(GS).fill(null));

function prefillGrid(cfg) {
  const g = emptyGrid(), rc = Array(GS).fill(0), cc = Array(GS).fill(0), items = [];
  for (let i = 0; i < cfg.stones; i++) items.push('s');
  for (let i = 0; i < cfg.pregems; i++) items.push('g');
  for (let i = 0; i < cfg.plain; i++) items.push('b');
  let guard = 0;
  items.forEach(t => {
    while (guard++ < 800) {
      const r = 2 + rnd(GS - 2), c = rnd(GS);
      if (g[r][c] || rc[r] >= 7 || cc[c] >= 7) continue;
      g[r][c] = t === 's' ? { t: 's' } : { t: 'b', c: rnd(8), g: t === 'g' };
      rc[r]++; cc[c]++; break;
    }
  });
  return g;
}

function newState(mode, cfg) {
  return {
    mode, cfg: cfg || null, grid: cfg ? prefillGrid(cfg) : emptyGrid(),
    score: 0, shown: 0, lines: 0, gems: 0, moves: 0,
    movesLeft: cfg && cfg.moves != null ? cfg.moves : null,
    combo: 0, sinceClear: 0, maxCombo: 0, lineProg: 0,
    powers: { bomb: 1, shuffle: 1, undo: 1 }, used: 0,
    blocks: [null, null, null], snapshot: null,
    busy: false, over: false, targeting: null, startBest: save.best,
  };
}

function canPlace(m, r0, c0) {
  for (let r = 0; r < m.length; r++) for (let c = 0; c < m[0].length; c++) {
    if (!m[r][c]) continue;
    const gr = r0 + r, gc = c0 + c;
    if (gr < 0 || gr >= GS || gc < 0 || gc >= GS || S.grid[gr][gc]) return false;
  }
  return true;
}
function fitsAnywhere(m) {
  for (let r = 0; r <= GS - m.length; r++) for (let c = 0; c <= GS - m[0].length; c++) if (canPlace(m, r, c)) return true;
  return false;
}
const anyMove = () => S.blocks.some(b => b && fitsAnywhere(b.m));

function genBlock(color, rate) {
  const sh = pickShape(); let cells = 0;
  sh.m.forEach(row => row.forEach(v => { if (v) cells++; }));
  return { m: sh.m, c: color, gem: Math.random() < rate ? rnd(cells) : -1 };
}
function dealTray() {
  const rate = S.cfg ? S.cfg.gemRate : 0;
  let tray = null;
  for (let a = 0; a < 40; a++) {
    const cs = [0, 1, 2, 3, 4, 5, 6, 7].sort(() => Math.random() - .5);
    tray = [genBlock(cs[0], rate), genBlock(cs[1], rate), genBlock(cs[2], rate)];
    if (tray.some(b => fitsAnywhere(b.m))) break;
  }
  if (!tray.some(b => fitsAnywhere(b.m))) tray = [{ m: [[1]], c: rnd(8), gem: -1 }, { m: [[1, 1]], c: rnd(8), gem: -1 }, { m: [[1], [1]], c: rnd(8), gem: -1 }];
  S.blocks = tray;
}

/* =========================================================
   Keyboard Accessibility logic
   ========================================================= */
function stopKb() {

      clearPreview();

      kbI = -1;

}

trayEl.addEventListener('keydown', e => {
  if (kbMode || S.busy || S.over) return;
  const slot = e.target.closest('.slot');
  if (!slot) return;
  if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      const i = +slot.dataset.i;
      if (!S.blocks[i]) return;
      kbMode = true; kbI = i; kbCursor = {r: 4, c: 4};
      drag = { i, b: S.blocks[i], valid: false };
      updatePreview(kbCursor.r, kbCursor.c);
      SFX.pick();
  }
});

window.addEventListener('keydown', e => {
  if (kbMode) {
      if (e.key === 'Escape') { stopKb(); return; }
      let dr = 0, dc = 0;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') dr = -1;
      if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') dr = 1;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') dc = -1;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') dc = 1;
      
      if (dr !== 0 || dc !== 0) {
          e.preventDefault();
          const h = drag.b.m.length, w = drag.b.m[0].length;
          kbCursor.r = Math.max(0, Math.min(GS - h, kbCursor.r + dr));
          kbCursor.c = Math.max(0, Math.min(GS - w, kbCursor.c + dc));
          updatePreview(kbCursor.r, kbCursor.c);
      }
      
      if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (drag.valid && canPlace(drag.b.m, drag.r, drag.c)) {
              const drg = drag;
              stopKb();
              place(drg.i, drg.r, drg.c);
          } else {
              SFX.invalid();
          }
      }
  } else {
      if (e.key === 'Escape') { 
          if (S && S.targeting) cancelTarget(); 
          else if (overlay.classList.contains('on') && S && !S.over) hideModal(); 
          else if (!overlay.classList.contains('on')) showMenu(); 
      }
  }
});

/* =========================================================
   Placement + line resolution
   ========================================================= */
function snap() {
  return JSON.stringify({ grid: S.grid, score: S.score, lines: S.lines, gems: S.gems, moves: S.moves, movesLeft: S.movesLeft, combo: S.combo, sinceClear: S.sinceClear, maxCombo: S.maxCombo, lineProg: S.lineProg, powers: S.powers, blocks: S.blocks });
}
function setBusy(v) { S.busy = v; updatePower(); }

function place(i, r0, c0) {
  const st = S, b = st.blocks[i];
  st.snapshot = snap();
  let k = 0; const placed = [];
  b.m.forEach((row, r) => row.forEach((v, c) => {
    if (!v) return;
    st.grid[r0 + r][c0 + c] = { t: 'b', c: b.c, g: k === b.gem }; k++; placed.push([r0 + r, c0 + c]);
  }));
  measure();
  placed.forEach(([r, c]) => { paintCell(r, c); cellEl(r, c).classList.add('land'); const p = cxy(r, c); burst(p.x, p.y, col(b.c), 2, .5); });
  SFX.place(); vib(8);
  st.score += placed.length; st.moves++;
  if (st.movesLeft != null) st.movesLeft--;
  st.blocks[i] = null;

  // find completed lines
  const rows = [], cols = [];
  for (let r = 0; r < GS; r++) if (st.grid[r].every(Boolean)) rows.push(r);
  for (let c = 0; c < GS; c++) if (st.grid.every(row => row[c])) cols.push(c);
  const L = rows.length + cols.length;
  let clearDur = 0;

  if (L > 0) {
    const set = new Map();
    rows.forEach(r => { for (let c = 0; c < GS; c++) set.set(r * GS + c, { r, c, v: st.grid[r][c] }); });
    cols.forEach(c => { for (let r = 0; r < GS; r++) set.set(r * GS + c, { r, c, v: st.grid[r][c] }); });
    const list = [...set.values()];
    const gems = list.filter(it => it.v.g).length;
    st.combo = st.combo > 0 ? st.combo + 1 : 1; st.sinceClear = 0; st.maxCombo = Math.max(st.maxCombo, st.combo);
    const base = [0, 10, 30, 60, 100, 150, 210][Math.min(L, 6)];
    const gain = base * st.combo + gems * 5;
    st.score += gain; st.lines += L; st.gems += gems; st.lineProg += L;
    list.forEach(it => { st.grid[it.r][it.c] = null; });

    // origin of wave = centre of the placed piece
    const origin = { r: placed.reduce((a, p) => a + p[0], 0) / placed.length, c: placed.reduce((a, p) => a + p[1], 0) / placed.length };
    clearDur = animateClear(st, list, origin);
    // beams + rings + banner
    setTimeout(() => {
      if (S !== st) return; measure();
      rows.forEach(r => { beam(M.x0 - 6, M.y0 + r * M.step - 2, GS * M.step + 6, M.cell + 4); const p = cxy(r, 4.5); ring(p.x, p.y, '#ffffff', GS * M.step * .5); });
      cols.forEach(c => { beam(M.x0 + c * M.step - 2, M.y0 - 6, M.cell + 4, GS * M.step + 6); const p = cxy(4.5, c); ring(p.x, p.y, '#ffffff', GS * M.step * .5); });
    }, 30);
    const words = L === 1 ? ['Nice!', 'Sweet!', 'Good!'][rnd(3)] : L === 2 ? 'Great!' : L === 3 ? 'Excellent!' : L === 4 ? 'Amazing!' : 'UNREAL!';
    banner(words, st.combo >= 2 ? `Combo ×${st.combo}` : '');
    const cen = { x: 0, y: 0 }; list.forEach(it => { const p = cxy(it.r, it.c); cen.x += p.x; cen.y += p.y; }); cen.x /= list.length; cen.y /= list.length;
    floatText(cen.x, cen.y, '+' + gain, L >= 2 || st.combo >= 2 ? 'big' : '');
    shake(Math.min(11, 2 + L * 2 + st.combo));
    SFX.clear(L, st.combo); vib(L > 1 ? [15, 30, 25] : 18);
    if (gems) setTimeout(() => SFX.gem(), 200);
    while (st.lineProg >= 8) { st.lineProg -= 8; awardPower(st); }
  } else if (st.combo > 0) {
    st.sinceClear++; if (st.sinceClear >= 3) { st.combo = 0; st.sinceClear = 0; }
  }

  // perfect clear
  if (L > 0 && st.grid.every(row => row.every(v => !v))) {
    st.score += 300;
    setTimeout(() => { if (S !== st) return; banner('Perfect!', '+300'); confetti(90); SFX.win(); awardPower(st); }, clearDur * .6);
  }

  let fresh = false;
  if (st.blocks.every(x => x === null)) { dealTray(); fresh = true; }

  updateHUD(); updateCombo();
  scoreEl.classList.remove('pulse'); void scoreEl.offsetWidth; scoreEl.classList.add('pulse');

  setBusy(true);
  setTimeout(() => afterMove(st), Math.max(60, clearDur));
}

function animateClear(st, list, origin) {
  measure(); let maxD = 0;
  list.forEach(it => {
    const el = cellEl(it.r, it.c), d = Math.min(320, Math.hypot(it.r - origin.r, it.c - origin.c) * 34);

const POWER_NAMES = { bomb: '💣 Bomb', shuffle: '🔀 Shuffle', undo: '↩ Undo' };
function awardPower(st) {

function afterMove(st) {

    if (!t || t === 'auto') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    $('btn-theme').textContent = t === 'dark' ? '☀️' : '🌙';
}
$('btn-theme').addEventListener('click', () => {
    save.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    persist();
    applyTheme();
});

/* ---------- boot ---------- */
applyTheme();
syncSoundBtn();

if (save.ongoing) {
    try {
        S = JSON.parse(save.ongoing);
        S.busy = false; // ensure not locked
    } catch(e) {
        S = newState('endless');
        dealTray();
    }
} else {
    S = newState('endless');
    dealTray();
}

renderAll(); 
measure();
showHome();

})();
</script>
</body>
</html>
